# Keeps sitemap.xml in step with the CMS. Pages CMS saves articles by committing
# content/articles.json; this workflow runs on that commit, rebuilds the sitemap and RSS feed
# and commits it back, then asks GitHub Pages to redeploy.
name: Update sitemap and feed

on:
  push:
    paths:
      - "content/articles.json"
      - "js/config.js"
      - "scripts/generate-sitemap.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate sitemap.xml and feed.xml
        run: node scripts/generate-sitemap.mjs
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- sitemap.xml feed.xml; then
            echo "Sitemap and feed already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml
          git commit -m "chore: update sitemap and feed"
          git push
          # Pushes made with the built-in token do not start a Pages build on their own.
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
